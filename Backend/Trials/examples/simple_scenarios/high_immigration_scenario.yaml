# High Climate Stress Scenario Parameters
# This file contains parameter values for the high climate stress scenario
# Used with simple_population_model.yaml structure

scenario:
  name: "High Climate Stress Scenario"
  description: "Population dynamics under elevated climate stress conditions"
  version: "2.0"
  created_date: "2024-01-15"
  model_file: "model_structure.yaml"
  based_on: "baseline_scenario.yaml"

# Parameter overrides for high climate stress scenario
constants:
  # Same base population distribution as baseline
  base_population_distribution:
    - [[1500, 1200, 800], [2000, 1800, 1000]]    # young: [low, med, high] x [urban, rural]
    - [[2500, 2200, 1500], [1800, 1600, 1200]]   # adult: [low, med, high] x [urban, rural]
    - [[800, 600, 400], [600, 500, 300]]         # elderly: [low, med, high] x [urban, rural]

  # Climate stress impacts on demographic rates
  fertility_rate: 0.020      # REDUCED fertility due to climate stress (20% reduction)
  mortality_rate: 0.018      # INCREASED mortality due to climate stress (20% increase)
  immigration_rate: 0.02    # REDUCED immigration due to regional climate impacts (33% reduction)
  emigration_rate: 0.004     # INCREASED emigration due to climate stress (2x baseline)

# Model configuration overrides
model_config:
  time_horizon: 50
  dt: 0.25
