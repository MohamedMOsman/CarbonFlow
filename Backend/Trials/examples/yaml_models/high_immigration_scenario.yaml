# High Immigration Scenario Parameters
# This file contains parameter values for the high immigration scenario
# Used with simple_population_model.yaml structure

scenario:
  name: "High Immigration Scenario"
  description: "Population dynamics with increased immigration rates"
  version: "1.0"
  created_date: "2024-01-15"
  model_file: "simple_population_model.yaml"
  based_on: "baseline_scenario.yaml"

# Parameter overrides for high immigration scenario
constants:
  # Same base population distribution as baseline
  base_population_distribution:
    - [[1500, 1200, 800], [2000, 1800, 1000]]    # young: [low, med, high] x [urban, rural]
    - [[2500, 2200, 1500], [1800, 1600, 1200]]   # adult: [low, med, high] x [urban, rural]
    - [[800, 600, 400], [600, 500, 300]]         # elderly: [low, med, high] x [urban, rural]

  # Basic demographic rates - ONLY immigration rate is different from baseline
  fertility_rate: 0.025      # births per person per year (same as baseline)
  mortality_rate: 0.010      # deaths per person per year (same as baseline)
  immigration_rate: 0.08    # HIGHER immigration per person per year (2.7x baseline)
  emigration_rate: 0.002     # emigration per person per year (same as baseline)

# Model configuration overrides
model_config:
  time_horizon: 50
  dt: 0.25
