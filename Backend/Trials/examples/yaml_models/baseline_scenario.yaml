# Baseline Scenario Parameters
# This file contains parameter values for the baseline scenario
# Used with simple_population_model.yaml structure

scenario:
  name: "Simple Baseline Scenario"
  description: "Basic population dynamics with moderate conditions"
  version: "1.0"
  created_date: "2024-01-15"
  model_file: "simple_population_model.yaml"

# Parameter overrides for baseline scenario
constants:
  # Base population distribution [age_group, income_level, region]
  base_population_distribution:
    - [[1500, 1200, 800], [2000, 1800, 1000]]    # young: [low, med, high] x [urban, rural]
    - [[2500, 2200, 1500], [1800, 1600, 1200]]   # adult: [low, med, high] x [urban, rural]
    - [[800, 600, 400], [600, 500, 300]]         # elderly: [low, med, high] x [urban, rural]

  # Basic demographic rates - baseline values
  fertility_rate: 0.025      # births per person per year
  mortality_rate: 0.015      # deaths per person per year
  immigration_rate: 0.003    # immigration per person per year
  emigration_rate: 0.002     # emigration per person per year

# Model configuration overrides
model_config:
  time_horizon: 50
  dt: 0.25
